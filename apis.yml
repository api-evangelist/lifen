aid: lifen
name: Lifen
description: 'Lifen (Honestica SAS, Paris) is a French digital-health company whose Lifen Platform
  exposes FHIR R4 APIs that let e-health applications exchange health data with French hospital
  information systems and with healthcare professionals over the national MSSanté secure-messaging
  network. The platform is organised as API Services: Hospital API Services (an Identity & Encounter
  service giving secure access to patient administrative, coverage, encounter and appointment data
  inside a given hospital, and a Send-documents-to-EHR service that pushes medical documents into
  hospital Electronic Health Records), and National API Services (the MSS service for sending medical
  documents to healthcare professionals via MSSanté). Access is machine-to-machine over OAuth 2.0
  client credentials, scoped by functional scopes and bound to a healthcare organisation through a
  database_reference. Lifen also ships an SSO/OIDC API and a signed webhook surface for patient and
  encounter events. The company is ISO 27001 certified and an HDS (Hebergeur de Donnees de Sante)
  certified health-data host.'
