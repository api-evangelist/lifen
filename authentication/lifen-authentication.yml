schemes:
- name: client_credentials
  type: oauth2
  flow: clientCredentials
  token_endpoint: https://authentication.lifen.fr/v1/token
  token_endpoint_test: https://authentication.post-prod.lifen.fr/v1/token
  request_parameters:
  - client_id
