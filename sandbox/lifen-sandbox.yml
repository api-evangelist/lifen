environment_selection:
  mechanism: The `audience` parameter on the token request plus the API host select the
    environment; there is no test/live key prefix.
test_data:
  magic_values: []
  note: >-
    Lifen publishes no magic/synthetic identifiers, test cards or fixture triggers. Test data is
    whatever the account manager provisions in the post-prod tenant for the healthcare organisation
    bound to the database_reference.
tooling:
