    run_in_postman: https://developer.lifen.fr/docs/quickstart
  webhook_testing:
    description: Register a webhook.site URL as the callback in the developer portal, then press the
      test button to fire a synthetic event and verify signature, headers and payload shape.
    docs: https://developer.lifen.fr/docs/webhook
  time_simulation: false
  fixture_triggers: false
